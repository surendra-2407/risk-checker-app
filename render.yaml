services:
  - type: web
    runtime: static
    name: risk-checker-frontend
    rootDir: risk-checker-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

  - type: web
    name: risk-checker-backend
    env: node
    rootDir: risk-checker-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: FRONTEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITGUARDIAN_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
